[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

# Send www to the bare domain so the QR code and links all land on one address
[[redirects]]
  from = "https://www.forumforcontemporarystudies.org/*"
  to = "https://forumforcontemporarystudies.org/:splat"
  status = 301
  force = true

# Admin Log-In: the dashboard runs in Google Apps Script and only opens for the
# Forum's Google account (info@nycfcs.org).
[[redirects]]
  from = "/admin"
  to = "https://script.google.com/a/macros/nycfcs.org/s/AKfycbzLQ6FX5M7RDHRkV0EShEu1wGOyAFHNBsuIn7K1Bq2ZnoGgK5oGZHcJEjlqA4eYgIAMNg/exec"
  status = 302
  force = true
