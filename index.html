<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum for Contemporary Studies</title>
  <meta name="description" content="The Forum for Contemporary Studies. Join our mailing list to hear about future events.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/admin-flag.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/visit.js" defer></script>
  <script src="/form.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo-link"><img src="/logo.png" alt="FCS." class="logo" width="146" height="60"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/" class="nav-link" aria-current="page">Join</a>
      <a href="/events/" class="nav-link">Events</a>
      <a href="/admin" class="admin-link">Admin Log-In</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Forum for<br>Contemporary Studies</h1>
    <div class="rule"></div>

    <section class="intro">
      <p>Thank you for joining us. Leave your details below to learn about the next FCS event.</p>
    </section>

    <form name="mailing-list" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="company" class="signup">
      <input type="hidden" name="form-name" value="mailing-list">
      <p class="hp" aria-hidden="true">
        <label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="field">
        <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="120" aria-describedby="name-error">
        <p class="error" id="name-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="200" aria-describedby="email-error">
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="opt">(optional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" aria-describedby="phone-error">
        <p class="error" id="phone-error" aria-live="polite"></p>
      </div>

      <p class="form-alert" id="form-alert" role="alert"></p>

      <button type="submit">Join the mailing list</button>

      <p class="fine"><span class="req">*</span> Required. We only use your details to tell you about FCS events.</p>
    </form>
  </main>

  <footer>
    <nav class="social" aria-label="Social media">
      <a href="https://x.com/nyc_fcs" target="_blank" rel="noopener" aria-label="FCS on X (@nyc_fcs)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="https://www.instagram.com/nycfcs" target="_blank" rel="noopener" aria-label="FCS on Instagram (@nycfcs)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
    </nav>
    <p>&copy; 2026 Forum for Contemporary Studies</p>
  </footer>
</body>
</html>
